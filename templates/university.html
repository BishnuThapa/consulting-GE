{% extends "base.html" %} 
{% load static %} 
{% block title %} Universities |Greenearth Education Consultancy 
{% endblock title %} 
{% block content %}

<main>
  <!-- breadcrumb start -->
  <section
    class="breadcrumb pos-rel bg_img"
    data-background="{% static 'assets/img/breadcrumb_bg.png' %}"
  >
    <div class="container">
      <div class="breadcrumb__content">
        <h2 class="breadcrumb__title">Universities</h2>
      </div>
    </div>
    <div class="breadcrumb__circle">
      <span class="big" data-parallax='{"y" : 100, "scale" : 0.1}'></span>
      <span class="small" data-parallax='{"y" : 100, "scale" : 0.1}'></span>
    </div>
    <div class="breadcrumb__shape">
      <div class="shape shape--1">
        <div class="shape-inner" data-parallax='{"x":-50,"y":80}'>
          <img src="assets/img/shape/br_shape1.html" alt="" />
        </div>
      </div>
      <div class="shape shape--2">
        <div class="shape-inner" data-parallax='{"x":50,"y":-90}'>
          <img src="assets/img/shape/br_shape2.html" alt="" />
        </div>
      </div>
    </div>
  </section>
  <!-- breadcrumb end -->

  <!-- brand start -->
  <section class="brand gray-bg-2 pos-rel pt-120 pb-120">
    <div class="container">
      <div class="sec-title style-2 text-center mb-60">
        <span class="sec-title--sub"
          ><i class="fa-solid fa-star" style="color: rgb(255, 83, 28);"></i>top institutions<i class="fa-solid fa-star" style="color: rgb(255, 83, 28);"></i></span>
      </div>
      <div class="xb-brand xb-brand1 ul_li">
        {% for uni in universities %}
        <div class="xb-item--item">
          <a class="xb-item--inner" href="#!"
            ><img src="{{ uni.image.url }}" alt="{{ uni.title}}"
          /></a>
        </div>
        {% endfor %}
        
      </div>
    </div>
    
  </section>
  <!-- brand end -->
</main>
{% endblock content %}
