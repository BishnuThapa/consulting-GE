{% extends "base.html" %} 
{% load static %}
{% block content %}

<main>
  <!-- breadcrumb start -->
  <section
    class="breadcrumb pos-rel bg_img"
    data-background="{% static 'assets/img/breadcrumb_bg.png' %}"
  >
    <div class="container">
      <div class="breadcrumb__content">
        <h2 class="breadcrumb__title">{{ blog.title }}</h2>
      </div>
    </div>
    <div class="breadcrumb__circle">
      <span class="big" data-parallax='{"y" : 100, "scale" : 0.1}'></span>
      <span class="small" data-parallax='{"y" : 100, "scale" : 0.1}'></span>
    </div>
    <div class="breadcrumb__shape">
      <div class="shape shape--1">
        <div class="shape-inner" data-parallax='{"x":-50,"y":80}'>
          <img src="assets/img/shape/br_shape1.html" alt="" />
        </div>
      </div>
      <div class="shape shape--2">
        <div class="shape-inner" data-parallax='{"x":50,"y":-90}'>
          <img src="assets/img/shape/br_shape2.html" alt="" />
        </div>
      </div>
    </div>
  </section>
  <!-- breadcrumb end -->

  <!-- blog start -->
  <section class="blog pt-120 pb-120">
    <div class="container">
      <div class="row">
        <div class="col-lg-8">
          <div class="blog-post-wrapper">
            <article class="post-details">
              <div class="post-thumb">
                <img src="{{ blog.image.url}}" alt="" />
              </div>
              
              <h2>
                {{ blog.title }}
              </h2>
              <p>
               {{ blog.description | safe }}
              </p>
              
              
             
            </article>
           
          </div>
        </div>
        <div class="col-lg-4">
          <div class="blog-sidebar">
            
            <div class="widget">
              <h3 class="widget-title">Related Posts</h3>
              <div class="widget__post">
                 {% for blog in related_blogs %}
                <div class="widget__post-item ul_li">
                  <div class="post-thumb">
                    <a href="{% url 'blog_detail' blog.slug %}"
                      ><img src="{{ blog.image.url }}" alt=""
                    /></a>
                  </div>
                  <div class="post-content">
                    <span class="post-date">{{ blog.created_at|date:"d F Y" }}</span>
                    <h4 class="post-title border-effect-2">
                      <a href="{% url 'blog_detail' blog.slug %}"
                        >{{ blog.title }}}}</a
                      >
                    </h4>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>
            
            
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- blog end -->

  
</main>

{% endblock content %}
